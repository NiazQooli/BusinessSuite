<section class="page">
  <header class="page__header">
    <h1>Dashboard</h1>
    <p>Overview of your BusinessSuite workspace.</p>
  </header>

  @if (loading()) {
    <p class="muted">Loading metrics…</p>
  } @else if (error()) {
    <p class="error">{{ error() }}</p>
  } @else {
    <div class="metric">
      <span class="metric__label">Customers</span>
      <strong class="metric__value">{{ customerCount() }}</strong>
    </div>
  }
</section>
