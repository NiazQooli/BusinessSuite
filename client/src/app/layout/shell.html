<div class="shell">
  <aside class="shell__sidebar">
    <div class="shell__brand">
      <img class="shell__logo" src="/brand/fresher-logo.png" width="140" height="46" alt="Fresher" />
      <p class="shell__product">Essential</p>
    </div>

    <nav class="shell__nav">
      <a routerLink="/dashboard" routerLinkActive="is-active">Dashboard</a>
      <a routerLink="/customers" routerLinkActive="is-active">Customers</a>
    </nav>

    <a class="shell__logout" routerLink="/login" (click)="signOut()">Sign out</a>
  </aside>

  <main class="shell__content">
    <router-outlet />
  </main>
</div>
